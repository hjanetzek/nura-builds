# zynthian (Qt Quick UI) for Nura: Qt 6.12, PySide6, the zynthian packages, and images for the
# devices in targets/zynthian.sh. Run by hand (Actions > zynthian > Run workflow), on pushes to
# this repository, and weekly with Qt and PySide rebuilt from scratch (input "rebuild"): they
# replace Alpine's versions and link against its libraries, so a soname change in Alpine (ICU,
# OpenSSL, ...) breaks them without any change to their recipes.
name: zynthian

on:
  workflow_dispatch:
    inputs:
      zynthian-ui-ref: { description: "zynthian-ui branch", default: nura }
      zyncoder-ref: { description: "zyncoder branch", default: nura }
      release: { description: "publish the images as a release", type: boolean, default: false }
      images: { description: "build the device images (off by default while the plugins settle)", type: boolean, default: false }
      rebuild: { description: "rebuild Qt and PySide from scratch (as the weekly run)", type: boolean, default: false }
      # x86_64: the packages for amd64 (release "x86_64") and the QEMU image (qemu-amd64) on
      # x86-64 runners; pushes and the weekly run build aarch64
      arch: { description: "architecture", type: choice, options: [aarch64, x86_64], default: aarch64 }
  schedule:
    - cron: "0 1 * * 0"   # Sunday 01:00 UTC
  push:
    branches: [main]
    paths: ["aports/**", "scripts/**", "targets/zynthian.sh", ".github/workflows/zynthian.yml", ".github/workflows/stage.yml"]

# The weekly rebuild (hours) has its own group: a push meanwhile doesn't cancel it
concurrency:
  group: zynthian-${{ github.ref }}-${{ inputs.arch || 'aarch64' }}${{ github.event_name == 'schedule' && '-weekly' || '' }}
  cancel-in-progress: true

env:
  NURA_ARCH: ${{ inputs.arch || 'aarch64' }}
  REBUILD: ${{ inputs.rebuild || github.event_name == 'schedule' }}
  REFS: ZYNTHIAN_UI_REF=${{ inputs.zynthian-ui-ref || 'nura' }} ZYNCODER_REF=${{ inputs.zyncoder-ref || 'nura' }}

jobs:
  # Which stages have to run (scripts/plan.sh): a stage whose packages are cached under its exact
  # key is skipped altogether, the next stage takes them from the cache. Also the inputs of the
  # stages (the env context isn't available in a reusable workflow's "with").
  plan:
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    outputs:
      refs: ${{ steps.refs.outputs.refs }}
      key_qt1: ${{ steps.plan.outputs.key_qt1 }}
      run_qt1: ${{ steps.plan.outputs.run_qt1 }}
      rebuild_qt1: ${{ steps.plan.outputs.rebuild_qt1 }}
      key_qt2: ${{ steps.plan.outputs.key_qt2 }}
      run_qt2: ${{ steps.plan.outputs.run_qt2 }}
      rebuild_qt2: ${{ steps.plan.outputs.rebuild_qt2 }}
      key_qt3: ${{ steps.plan.outputs.key_qt3 }}
      run_qt3: ${{ steps.plan.outputs.run_qt3 }}
      rebuild_qt3: ${{ steps.plan.outputs.rebuild_qt3 }}
      key_pyside: ${{ steps.plan.outputs.key_pyside }}
      run_pyside: ${{ steps.plan.outputs.run_pyside }}
      rebuild_pyside: ${{ steps.plan.outputs.rebuild_pyside }}
      key_plugins: ${{ steps.plan.outputs.key_plugins }}
      run_plugins: ${{ steps.plan.outputs.run_plugins }}
      rebuild_plugins: ${{ steps.plan.outputs.rebuild_plugins }}
      key_zynthian: ${{ steps.plan.outputs.key_zynthian }}
      run_zynthian: ${{ steps.plan.outputs.run_zynthian }}
      rebuild_zynthian: ${{ steps.plan.outputs.rebuild_zynthian }}
    steps:
      - uses: actions/checkout@v7
      - id: refs
        run: echo "refs=$REFS" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          NURA_ABUILD_KEY: ${{ secrets.NURA_ABUILD_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: TARGET=zynthian scripts/plan.sh

  qt1:
    needs: plan
    # runs after a skipped stage too (!failure() instead of the default success())
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.run_qt1 == 'true' }}
    uses: ./.github/workflows/stage.yml
    with: { target: zynthian, arch: "${{ inputs.arch || 'aarch64' }}", stage: qt1, key: "${{ needs.plan.outputs.key_qt1 }}", refs: "${{ needs.plan.outputs.refs }}", rebuild: "${{ needs.plan.outputs.rebuild_qt1 == 'true' }}" }
    secrets: inherit
    permissions: { contents: read, actions: write }
  qt2:
    needs: [plan, qt1]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.run_qt2 == 'true' }}
    uses: ./.github/workflows/stage.yml
    with: { target: zynthian, arch: "${{ inputs.arch || 'aarch64' }}", stage: qt2, previous: qt1, previous-key: "${{ needs.plan.outputs.key_qt1 }}", previous-cached: "${{ needs.plan.outputs.run_qt1 != 'true' }}", key: "${{ needs.plan.outputs.key_qt2 }}", refs: "${{ needs.plan.outputs.refs }}", rebuild: "${{ needs.plan.outputs.rebuild_qt2 == 'true' }}" }
    secrets: inherit
    permissions: { contents: read, actions: write }
  qt3:
    needs: [plan, qt2]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.run_qt3 == 'true' }}
    uses: ./.github/workflows/stage.yml
    with: { target: zynthian, arch: "${{ inputs.arch || 'aarch64' }}", stage: qt3, previous: qt2, previous-key: "${{ needs.plan.outputs.key_qt2 }}", previous-cached: "${{ needs.plan.outputs.run_qt2 != 'true' }}", key: "${{ needs.plan.outputs.key_qt3 }}", refs: "${{ needs.plan.outputs.refs }}", rebuild: "${{ needs.plan.outputs.rebuild_qt3 == 'true' }}" }
    secrets: inherit
    permissions: { contents: read, actions: write }
  pyside:
    needs: [plan, qt3]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.run_pyside == 'true' }}
    uses: ./.github/workflows/stage.yml
    with: { target: zynthian, arch: "${{ inputs.arch || 'aarch64' }}", stage: pyside, previous: qt3, previous-key: "${{ needs.plan.outputs.key_qt3 }}", previous-cached: "${{ needs.plan.outputs.run_qt3 != 'true' }}", key: "${{ needs.plan.outputs.key_pyside }}", refs: "${{ needs.plan.outputs.refs }}", rebuild: "${{ needs.plan.outputs.rebuild_pyside == 'true' }}" }
    secrets: inherit
    permissions: { contents: read, actions: write }
  plugins:
    needs: [plan, pyside]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.run_plugins == 'true' }}
    uses: ./.github/workflows/stage.yml
    with: { target: zynthian, arch: "${{ inputs.arch || 'aarch64' }}", stage: plugins, previous: pyside, previous-key: "${{ needs.plan.outputs.key_pyside }}", previous-cached: "${{ needs.plan.outputs.run_pyside != 'true' }}", key: "${{ needs.plan.outputs.key_plugins }}", refs: "${{ needs.plan.outputs.refs }}", rebuild: "${{ needs.plan.outputs.rebuild_plugins == 'true' }}" }
    secrets: inherit
    permissions: { contents: read, actions: write }
  zynthian:
    needs: [plan, plugins]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.run_zynthian == 'true' }}
    uses: ./.github/workflows/stage.yml
    with: { target: zynthian, arch: "${{ inputs.arch || 'aarch64' }}", stage: zynthian, previous: plugins, previous-key: "${{ needs.plan.outputs.key_plugins }}", previous-cached: "${{ needs.plan.outputs.run_plugins != 'true' }}", key: "${{ needs.plan.outputs.key_zynthian }}", refs: "${{ needs.plan.outputs.refs }}", rebuild: "${{ needs.plan.outputs.rebuild_zynthian == 'true' }}" }
    secrets: inherit
    permissions: { contents: read, actions: write }

  # The device images only when asked for (Run workflow > images), not on pushes: off while the
  # plugin packages settle (2026-11-06); to build them on every push again, drop "inputs.images &&"
  image:
    needs: [plan, zynthian]
    if: ${{ inputs.images && !cancelled() && !failure() }}
    runs-on: ${{ inputs.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # as DEVICES (aarch64) and DEVICES_x86_64 in targets/zynthian.sh
        device: ${{ fromJSON(inputs.arch == 'x86_64' && '["qemu-amd64"]' || '["google-kukui"]') }}
    permissions:
      contents: write
    env:
      TARGET: zynthian
      NURA_WORK: /home/runner/nura-work
      NURA_SRC: /home/runner/nura-src
      NURA_OUT: /home/runner/nura-out
      NURA_ABUILD_KEY: ${{ secrets.NURA_ABUILD_KEY }}
      NURA_ABUILD_KEY_NAME: ${{ secrets.NURA_ABUILD_KEY_NAME }}
      NURA_PASSWORD: ${{ secrets.NURA_IMAGE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
      - uses: actions/download-artifact@v8
        with:
          name: packages-zynthian-zynthian
          path: /home/runner/nura-out
      - uses: ./.github/actions/pmaports

      - name: Set up pmbootstrap
        run: |
          export ${{ needs.plan.outputs.refs }}
          scripts/setup.sh
      - name: Image for ${{ matrix.device }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          scripts/image.sh ${{ matrix.device }}
      - uses: actions/upload-artifact@v7
        with:
          name: zynthian-${{ matrix.device }}
          path: /home/runner/nura-out/zynthian-${{ matrix.device }}.img.zst
          retention-days: 7
          compression-level: 0
      - name: Release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=zynthian-$(date +%Y%m%d)-${{ github.run_number }}
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --prerelease --title "zynthian $(date +%Y-%m-%d)" \
                 --notes "zynthian (Qt UI) for Nura, built from zynthian-ui ${{ inputs.zynthian-ui-ref }}, zyncoder ${{ inputs.zyncoder-ref }}"
          gh release upload "$tag" "$NURA_OUT/zynthian-${{ matrix.device }}.img.zst" --clobber
      - name: Build log
        if: failure()
        run: sudo tail -n 200 "$NURA_WORK/log.txt" || true

  # Releases (main only): the package repository (release "aarch64") and the images
  # (release "zynthian-latest"), see scripts/publish.sh
  publish:
    needs: [zynthian, image]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: packages-zynthian-zynthian
          path: out
      - uses: actions/download-artifact@v8
        if: needs.image.result == 'success'
        with:
          pattern: zynthian-*
          path: out/images
          merge-multiple: true
      # without images (image job skipped) only the package repository is published
      - name: Publish
        run: scripts/publish.sh zynthian out/packages.tar $(ls out/images/*.img.zst 2>/dev/null)

