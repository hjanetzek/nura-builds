# zynthian (Qt Quick UI) for Nura: the zynthian packages from the checkouts of its repositories
# (targets/zynthian.sh), on top of the published package repository (Qt, PySide, plugins: workflow
# sets.yml), and images for the target's devices. docs/ci-plan.md. Run by hand (Actions > zynthian
# > Run workflow, any architecture), on pushes to main that change the target, and weekly (aarch64,
# x86_64, armv7): the zynthian repositories' changes aren't pushes here.
name: zynthian

on:
  workflow_dispatch:
    inputs:
      arch: { description: "architecture", type: choice, options: [aarch64, x86_64, armv7], default: aarch64 }
      zynthian-ui-ref: { description: "zynthian-ui branch", default: main }
      zyncoder-ref: { description: "zyncoder branch", default: nura }
      images: { description: "build the device images", type: boolean, default: false }
      devices: { description: "image devices as JSON (empty: IMAGE_DEVICES of the target, the Pi with V4 and V5)", default: "" }
      release: { description: "also as a dated release (zynthian-<date>-<run>)", type: boolean, default: false }
  schedule:
    - cron: "0 1 * * 0"   # Sunday 01:00 UTC: aarch64
    - cron: "0 5 * * 0"   # Sunday 05:00 UTC: x86_64 (the QEMU VMs' packages)
    - cron: "0 9 * * 0"   # Sunday 09:00 UTC: armv7 (the S III Neo)
  push:
    branches: [main]
    paths: ["targets/zynthian.sh", "aports/zynthian-upstream/**", ".github/workflows/zynthian.yml", ".github/workflows/build-target.yml"]

concurrency:
  group: zynthian-${{ github.ref }}-${{ inputs.arch || (github.event.schedule == '0 5 * * 0' && 'x86_64') || (github.event.schedule == '0 9 * * 0' && 'armv7') || 'aarch64' }}
  cancel-in-progress: true

# Read-only by default; jobs that publish ask for more
permissions: { contents: read }

jobs:
  arch:
    runs-on: ubuntu-latest
    outputs:
      arch: ${{ steps.a.outputs.arch }}
      refs: ${{ steps.a.outputs.refs }}
    steps:
      - id: a
        env:
          ARCH: ${{ inputs.arch || (github.event.schedule == '0 5 * * 0' && 'x86_64') || (github.event.schedule == '0 9 * * 0' && 'armv7') || 'aarch64' }}
          UI_REF: ${{ inputs.zynthian-ui-ref || 'main' }}
          ZC_REF: ${{ inputs.zyncoder-ref || 'nura' }}
        run: |
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
          echo "refs=ZYNTHIAN_UI_REF=$UI_REF ZYNCODER_REF=$ZC_REF" >> "$GITHUB_OUTPUT"

  build:
    needs: arch
    uses: ./.github/workflows/build-target.yml
    with:
      target: zynthian
      arch: ${{ needs.arch.outputs.arch }}
      refs: ${{ needs.arch.outputs.refs }}
      images: ${{ inputs.images || false }}
      devices: ${{ inputs.devices || '' }}
    secrets:
      NURA_ABUILD_KEY: ${{ secrets.NURA_ABUILD_KEY }}
      NURA_ABUILD_KEY_NAME: ${{ secrets.NURA_ABUILD_KEY_NAME }}
      NURA_IMAGE_PASSWORD: ${{ secrets.NURA_IMAGE_PASSWORD }}

  # main only: the packages merged into the release "<arch>", the images into "zynthian-latest"
  # (armv7: "zynthian-armv7-latest"), see scripts/publish.sh. Serialized per architecture with
  # every other publishing workflow.
  publish:
    needs: [arch, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main' }}
    concurrency: { group: "publish-${{ needs.arch.outputs.arch }}", cancel-in-progress: false }
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env:
      NURA_ARCH: ${{ needs.arch.outputs.arch }}
      NURA_IMAGE_TAG: ${{ needs.arch.outputs.arch == 'armv7' && 'zynthian-armv7-latest' || 'zynthian-latest' }}
      # the Pi images' guide for testers as the release's notes (aarch64)
      NURA_IMAGE_NOTES: ${{ needs.arch.outputs.arch == 'aarch64' && 'docs/zynthian-rpi-testing.md' || '' }}
      GH_TOKEN: ${{ github.token }}
      NURA_ABUILD_KEY: ${{ secrets.NURA_ABUILD_KEY }}
      NURA_ABUILD_KEY_NAME: ${{ secrets.NURA_ABUILD_KEY_NAME }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v8
        with: { name: "new-zynthian-${{ needs.arch.outputs.arch }}", path: new }
      - uses: actions/download-artifact@v8
        if: inputs.images
        with: { pattern: "zynthian-*", path: images, merge-multiple: true }
      - name: Publish
        run: |
          # shellcheck disable=SC2046 # the image files, if any
          scripts/publish.sh zynthian new -- $(ls images/*.img.zst 2>/dev/null)
      - name: Dated release
        if: inputs.release && inputs.images
        env:
          UI_REF: ${{ inputs.zynthian-ui-ref }}
          ZC_REF: ${{ inputs.zyncoder-ref }}
        run: |
          tag=zynthian-$(date +%Y%m%d)-${{ github.run_number }}
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --prerelease --title "zynthian $(date +%Y-%m-%d)" \
                 --notes "zynthian (Qt UI) for Nura ($NURA_ARCH), built from zynthian-ui $UI_REF, zyncoder $ZC_REF"
          gh release upload "$tag" images/*.img.zst --clobber
