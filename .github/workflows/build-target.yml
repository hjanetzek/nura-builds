# A target's own packages (targets/<target>.sh: the stages in STAGES, built from the checkouts of
# its repositories) for one architecture, on top of the published package repository (release
# "<arch>": Qt, PySide, plugins, libraries come from there, docs/ci-plan.md); the new packages as
# the artifact new-<target>-<arch>, for images and publishing. Optionally the device images
# (IMAGE_DEVICES_<arch>, else DEVICES[_<arch>] of the target file, or the input), as artifacts
# <target>-<device> (one image, or one per kit: IMAGE_KITS_<device>).
name: build-target
on:
  workflow_call:
    inputs:
      target: { type: string, required: true }
      arch: { type: string, required: true }
      refs: { type: string, default: "" }      # e.g. "ZYNTHIAN_UI_REF=main ZYNCODER_REF=nura"
      images: { type: boolean, default: false }
      devices: { type: string, default: "" }   # JSON list; empty: the target file's for the arch
    outputs:
      devices:
        description: the devices images were built for (JSON list)
        value: ${{ jobs.build.outputs.devices }}
    secrets:
      NURA_ABUILD_KEY: { required: false }
      NURA_ABUILD_KEY_NAME: { required: false }
      NURA_IMAGE_PASSWORD: { required: false }

env:
  TARGET: ${{ inputs.target }}
  NURA_ARCH: ${{ inputs.arch }}
  # e.g. "ZYNTHIAN_UI_REF=main ZYNCODER_REF=nura": exported as words (no quotes)
  REFS: ${{ inputs.refs }}
  NURA_WORK: /home/runner/nura-work
  NURA_SRC: /home/runner/nura-src
  NURA_OUT: /home/runner/nura-out
  NURA_ABUILD_KEY: ${{ secrets.NURA_ABUILD_KEY }}
  NURA_ABUILD_KEY_NAME: ${{ secrets.NURA_ABUILD_KEY_NAME }}
  GH_TOKEN: ${{ github.token }}

# Read-only by default; jobs that publish ask for more
permissions: { contents: read }

jobs:
  build:
    runs-on: ${{ inputs.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 350
    outputs:
      devices: ${{ steps.devices.outputs.devices }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost || true
          df -h /
      - uses: ./.github/actions/pmaports
      - name: Set up pmbootstrap
        run: |
          # shellcheck disable=SC2086,SC2163 # NAME=value words
          export $REFS
          scripts/setup.sh
      - name: Published packages
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          scripts/fetch-released.sh
      - name: Build
        run: |
          # shellcheck disable=SC2086,SC2163 # NAME=value words
          export PATH="$HOME/.local/bin:$PATH" $REFS
          for stage in $(scripts/target-var.sh STAGES); do scripts/build.sh "$stage"; done
      - name: New packages
        if: success() || failure()
        run: scripts/collect-new.sh "$TARGET-$NURA_ARCH"
      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: new-${{ inputs.target }}-${{ inputs.arch }}
          path: /home/runner/nura-out/new/${{ inputs.target }}-${{ inputs.arch }}
          retention-days: 3
      - id: devices
        env:
          IMAGES: ${{ inputs.images }}
          DEVICES_INPUT: ${{ inputs.devices }}
        run: |
          if [ "$IMAGES" != true ]; then echo 'devices=[]' >> "$GITHUB_OUTPUT"; exit 0; fi
          d=$DEVICES_INPUT
          if [ -z "$d" ]; then
            # shellcheck disable=SC2046 # a list
            list=$(scripts/target-var.sh "IMAGE_DEVICES_$NURA_ARCH")
            [ -n "$list" ] || list=$(scripts/target-var.sh DEVICES)
            d=$(printf '%s\n' $list | jq -R . | jq -sc 'map(select(. != ""))')
          fi
          echo "devices=$d" >> "$GITHUB_OUTPUT"
      - name: Build log
        if: failure()
        run: scripts/show-log.sh 200

  image:
    needs: build
    if: ${{ needs.build.outputs.devices != '[]' && needs.build.outputs.devices != '' }}
    runs-on: ${{ inputs.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.build.outputs.devices) }}
    env:
      NURA_PASSWORD: ${{ secrets.NURA_IMAGE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
      - uses: ./.github/actions/pmaports
      - name: Set up pmbootstrap
        run: |
          # shellcheck disable=SC2086,SC2163 # NAME=value words
          export $REFS
          scripts/setup.sh
      - name: Published packages
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          scripts/fetch-released.sh
      - uses: actions/download-artifact@v8
        with: { name: "new-${{ inputs.target }}-${{ inputs.arch }}", path: /home/runner/new }
      - name: This run's packages
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ls /home/runner/new/*.apk >/dev/null 2>&1 || exit 0
          sudo cp /home/runner/new/*.apk "$NURA_WORK/packages/edge/$NURA_ARCH/"
          sudo chown -R 12345:12345 "$NURA_WORK/packages"
          pmbootstrap -c "$HOME/.config/pmbootstrap-nura-$TARGET.cfg" -y index
      - name: mtools (kit presets in images, scripts/image.sh)
        run: sudo apt-get install -y -qq mtools >/dev/null
      - name: Image for ${{ matrix.device }}
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          scripts/image.sh "$DEVICE"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.target }}-${{ matrix.device }}
          path: /home/runner/nura-out/${{ inputs.target }}-${{ matrix.device }}*.img.zst
          retention-days: 7
          compression-level: 0
      - name: Build log
        if: failure()
        run: scripts/show-log.sh 200
