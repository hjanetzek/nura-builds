# One build stage of a target (targets/<target>.sh), on a native arm64 runner: restore the
# packages of the previous stage, build this stage (or take its packages from the cache if its
# recipes and all earlier stages are unchanged), pass the package repository on as an artifact.
name: stage

on:
  workflow_call:
    inputs:
      target: { type: string, required: true }
      stage: { type: string, required: true }
      previous: { type: string, default: "" }       # previous stage (its artifact), "" for the first
      previous-key: { type: string, default: "" }   # previous stage's cache key
      refs: { type: string, default: "" }           # e.g. "ZYNTHIAN_UI_REF=nura ZYNCODER_REF=nura"
      # Build from scratch, ignoring this stage's cache, and replace the cached packages under the
      # same key (the weekly rebuild: our packages against the current versions of Alpine's
      # libraries, which a soname change would otherwise break without any recipe change). The
      # caller's job needs "actions: write" (deleting the old cache entry).
      rebuild: { type: boolean, default: false }
    outputs:
      key:
        description: cache key of this stage's packages (empty if not cacheable)
        value: ${{ jobs.build.outputs.key }}
    secrets:
      NURA_ABUILD_KEY: { required: false }
      NURA_ABUILD_KEY_NAME: { required: false }

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    outputs:
      key: ${{ steps.key.outputs.key }}
    env:
      TARGET: ${{ inputs.target }}
      NURA_WORK: /home/runner/nura-work
      NURA_SRC: /home/runner/nura-src
      NURA_OUT: /home/runner/nura-out
      NURA_ABUILD_KEY: ${{ secrets.NURA_ABUILD_KEY }}
      NURA_ABUILD_KEY_NAME: ${{ secrets.NURA_ABUILD_KEY_NAME }}
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost || true
          df -h /

      - name: Packages of the previous stage
        if: inputs.previous != ''
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ inputs.target }}-${{ inputs.previous }}
          path: /home/runner/nura-out

      - uses: ./.github/actions/pmaports

      - name: Set up pmbootstrap
        run: |
          export ${{ inputs.refs }}
          scripts/setup.sh

      - name: Cache key
        id: key
        run: |
          # packages-<target>-<stage>-<signing key>-<previous stage>-<this stage's inputs>: the
          # first part is the prefix of a partial match (restore-keys below), so a stage whose
          # recipes changed starts from its last packages and builds only what is out of date
          if grep -q "^INPUTS_${{ inputs.stage }}=\"..*\"" targets/$TARGET.sh; then
            h=$(scripts/build.sh --hash ${{ inputs.stage }})
            prev=$(echo "${{ inputs.previous-key }}" | sha256sum | cut -c1-8)
            # The signing key's public half: packages signed with another key are untrusted
            kfp=$(printf '%s\n' "$NURA_ABUILD_KEY" | openssl rsa -pubout 2>/dev/null | sha256sum | cut -c1-8)
            echo "key=packages-$TARGET-${{ inputs.stage }}-$kfp-$prev-$h" >> "$GITHUB_OUTPUT"
            echo "partial=packages-$TARGET-${{ inputs.stage }}-$kfp-$prev-" >> "$GITHUB_OUTPUT"
          else
            echo "key=" >> "$GITHUB_OUTPUT"
          fi

      - name: Cached packages
        id: cache
        if: steps.key.outputs.key != '' && !inputs.rebuild
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.key.outputs.key }}
          # Same signing key and previous stage, other inputs: only the same previous stage, as
          # a rebuilt dependency (a Qt module after qtbase) isn't rebuilt by its version alone
          restore-keys: ${{ steps.key.outputs.partial }}
          path: /home/runner/nura-out/packages.tar

      # A stage's cache holds the earlier stages' packages too: add only what the previous stage
      # didn't pass on, so packages it rebuilt (the weekly rebuild) win over the cached copies.
      # An exact match: that is the stage's result (written back for the next stage).
      - name: Merge the cached packages with the previous stage's
        if: steps.cache.outputs.cache-hit == 'true' && inputs.previous != ''
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          scripts/merge-cached.sh /home/runner/nura-out/packages.tar --save

      # A partial match: the stage's last packages; pmbootstrap then builds only the packages
      # whose pkgver-pkgrel isn't in the repository (a recipe change without a pkgrel bump isn't
      # rebuilt)
      - name: Earlier packages of ${{ inputs.stage }}
        if: steps.cache.outputs.cache-matched-key != '' && steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "from ${{ steps.cache.outputs.cache-matched-key }}"
          export PATH="$HOME/.local/bin:$PATH"
          scripts/merge-cached.sh /home/runner/nura-out/packages.tar

      - name: Build ${{ inputs.stage }}
        id: build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$HOME/.local/bin:$PATH" ${{ inputs.refs }}
          scripts/build.sh ${{ inputs.stage }}

      # Cache entries can't be overwritten: a rebuild deletes the old one under this key first
      - name: Replace the cached packages
        if: steps.key.outputs.key != '' && inputs.rebuild
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEY: ${{ steps.key.outputs.key }}
        run: gh cache delete "$KEY" || echo "no cache entry $KEY"

      - name: Save packages in the cache
        if: steps.key.outputs.key != '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.key.outputs.key }}
          path: /home/runner/nura-out/packages.tar

      # A failed build still saved what it built (scripts/build.sh): cache it under a key that is
      # never an exact match (only a successful build saves the stage's key) but has the partial
      # prefix, so the next attempt with the same previous stage builds only what is missing
      - name: Save the packages built so far
        if: failure() && steps.build.outcome == 'failure' && steps.key.outputs.key != ''
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.key.outputs.partial }}partial-${{ github.run_id }}-${{ github.run_attempt }}
          path: /home/runner/nura-out/packages.tar

      - name: Pass the packages on
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ inputs.target }}-${{ inputs.stage }}
          path: /home/runner/nura-out/packages.tar
          retention-days: 3

      - name: Build log
        if: failure()
        run: sudo tail -n 200 "$NURA_WORK/log.txt" || true
