# Real-time scheduling for the user manager, which runs PipeWire and WirePlumber (and the user's
# services). Without it they inherit RLIMIT_RTPRIO 0: PipeWire can't set its rt.prio 88 and falls
# back to rtkit, which grants 20, so its data loop (the driver, which wakes the graph) ran below
# the plugins' audio threads (83, from the session's limits) - found on the Duet. PipeWire's own
# limits (/etc/security/limits.d/25-pw-rlimits.conf, group pipewire) need pam_limits in the
# user manager's PAM stack, which postmarketOS doesn't have. Same as device-zynthian-rpi4's
# 50-zynthian-realtime.conf (installed beside it under another name).
[Service]
LimitRTPRIO=95
LimitNICE=-19
LimitMEMLOCK=infinity
