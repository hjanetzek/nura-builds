# nura-builds' CPU baseline per architecture: appended to the build user's abuild.conf
# (config_abuild, mounted as /home/pmos/.abuild in the chroots) by scripts/abuild-cpu.sh, which
# abuild reads after its default.conf (-Os and the hardening flags) and /etc/abuild.conf.
#
# By the build chroot's own architecture (apk --print-arch), not CARCH: abuild has not set CARCH
# yet when it reads this, and pmbootstrap's cross-native builds (the kernels: the native chroot,
# CARCH=armv7 in the environment) copy CFLAGS into the build machine's BUILDCFLAGS, which an x86
# or arm64 compiler would reject.
case "$(apk --print-arch 2>/dev/null)" in
armv7)
	# Cortex-A7 and newer (MSM8226 in the Galaxy S III Neo, Raspberry Pi 2 and 3 in 32 bit):
	# NEON, VFPv4 with fused multiply-add, 32 double registers. Alpine's armv7 baseline is
	# vfpv3-d16 without NEON (generic-armv7-a tuning); Cortex-A9 boards without NEON (Tegra 2)
	# are not supported. The float ABI stays hard: the packages mix with Alpine's.
	# NEON here serves code that uses it explicitly (intrinsics, Eigen, xsimd, JUCE's
	# SIMDRegister, fftw): GCC doesn't auto-vectorise float code with armv7 NEON (it flushes
	# denormals, not IEEE) unless -funsafe-math-optimizations allows it. Measured on the S III Neo
	# (lv2bench, artyfx: -O1 -ftree-vectorize): these flags alone 0.99x, with
	# -funsafe-math-optimizations 1.22x over the bundle (up to 3.1x). That one is a package's
	# choice (it reassociates float maths), not part of the baseline.
	export CFLAGS="$CFLAGS -mfpu=neon-vfpv4 -mtune=cortex-a7"
	export CXXFLAGS="$CXXFLAGS -mfpu=neon-vfpv4 -mtune=cortex-a7"
	export RUSTFLAGS="${RUSTFLAGS-} -Ctarget-cpu=cortex-a7"
	;;
esac
