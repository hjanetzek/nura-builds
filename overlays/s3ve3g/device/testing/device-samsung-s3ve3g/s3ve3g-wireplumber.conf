# Samsung Galaxy S III Neo (device-samsung-s3ve3g): the card's Pro Audio profile (its UCM/default
# profiles don't open: "Host is down"), as the MicroDexed-touch session (s3ve3g-mdt) needs it
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-sound" } ]
    actions = { update-props = { device.profile = "pro-audio" } }
  }
]
