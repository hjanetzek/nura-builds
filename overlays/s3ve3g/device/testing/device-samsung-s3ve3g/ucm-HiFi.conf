# Samsung Galaxy S III Neo: playback through the codec's speaker driver or the headphone jack.
# From the LineageOS mixer paths of s3ve3g-common ("speaker", "headset"); the back end runs at
# 48 kHz stereo on SLIMbus RX1 and RX2 (SLIMBUS_0_RX from the ADSP's MultiMedia1).

SectionVerb {
	EnableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 1"
		cset "name='SLIM RX1 MUX' AIF1_PB"
		cset "name='SLIM RX2 MUX' AIF1_PB"
	]

	DisableSequence [
		cset "name='SLIM RX1 MUX' ZERO"
		cset "name='SLIM RX2 MUX' ZERO"
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

# The codec's class D driver, mono: left and right mixed into RX4
SectionDevice."Speaker" {
	Comment "Speaker"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		cset "name='RX4 MIX1 INP1' RX1"
		cset "name='RX4 MIX1 INP2' RX2"
		cset "name='RX4 Digital Volume' 78"
		cset "name='SPK DRV Volume' 7"
		cset "name='COMP0 Switch' 0"
		cset "name='SPK DAC Switch' 1"
	]

	DisableSequence [
		cset "name='SPK DAC Switch' 0"
		cset "name='RX4 MIX1 INP1' ZERO"
		cset "name='RX4 MIX1 INP2' ZERO"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

# HPHL and HPHR, class H
SectionDevice."Headphones" {
	Comment "Headphones"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='RX1 MIX1 INP1' RX1"
		cset "name='RX2 MIX1 INP1' RX2"
		cset "name='CLASS_H_DSM MUX' RX_HPHL"
		cset "name='COMP1 Switch' 0"
		# the HPH PAs at their maximum and +6 steps of digital gain: with 16/84 the user found the
		# headphones very quiet
		cset "name='HPHL Volume' 20"
		cset "name='HPHR Volume' 20"
		cset "name='RX1 Digital Volume' 90"
		cset "name='RX2 Digital Volume' 90"
		cset "name='HPHL DAC Switch' 1"
	]

	DisableSequence [
		cset "name='HPHL DAC Switch' 0"
		cset "name='RX1 MIX1 INP1' ZERO"
		cset "name='RX2 MIX1 INP1' ZERO"
		cset "name='CLASS_H_DSM MUX' ZERO"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		JackControl "Headphone Jack"
	}
}

# The main microphone (bottom): AMIC1 with MIC BIAS1 External -> ADC1 -> DEC1 -> SLIM TX1, into
# the ADSP's MultiMedia2 (the back end is stereo: the ADSP gives the mono mic on both channels)
SectionDevice."Mic" {
	Comment "Microphone"

	EnableSequence [
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
		cset "name='DEC1 MUX' ADC1"
		cset "name='SLIM TX1 MUX' DEC1"
		cset "name='ADC1 Volume' 19"
		cset "name='DEC1 Volume' 84"
		cset "name='SLIM TX1' 1"
	]

	DisableSequence [
		cset "name='SLIM TX1' 0"
		cset "name='SLIM TX1 MUX' ZERO"
		cset "name='DEC1 MUX' ZERO"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}
