# Samsung Galaxy S III Neo: no qcom_smgr (the ADSP sensor hub's Sensor Manager). udev loads it when
# the ADSP announces its sensor service (qrtr:100:1), but it never probes here: the sensor registry
# qcom/sensors/sns.reg is missing (Android builds it from /system/etc/sensors/sensor_def*.conf at
# first start; the phone's Android partitions are gone), so it waits ~6 s and fails with
# -ETIMEDOUT - while udev-settle, seatd and zynthian wait for it (boot: first frame 37 -> 32 s).
# Accelerometer and gyroscope work without it (inv_mpu6050, I2C). Remove this file once there's a
# sns.reg (docs/samsung-s3ve3g.md, "Sensor hub").
blacklist qcom_smgr
