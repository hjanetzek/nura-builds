# Samsung Galaxy S III Neo (device-samsung-s3ve3g): PipeWire's clock as JACK's on this phone,
# 48 kHz and 960 frames, 20 ms (q6asm takes multiples of 480, 10 ms, since 6.18; 480 gave
# MicroDexed-touch xruns under load). Used by the
# MicroDexed-touch session (s3ve3g-mdt); zynthian's session runs jackd instead.
context.properties = {
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum = 960
    default.clock.min-quantum = 480
    default.clock.max-quantum = 960
}
