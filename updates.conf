# Per-recipe settings of the weekly update check (scripts/check-updates.py, update-check.yml):
#   <pkgname> skip                  not checked (meta packages, pinned on purpose)
#   <pkgname> github <owner>/<repo> look at this GitHub repository
#   <pkgname> repology <project>    look up this Repology project
#   <pkgname> ignore <regex>        versions matching it aren't reported
# Default: GitHub (source or url on github.com), Qt's download directory (Qt, PySide), else
# Repology under the pkgname without "-lv2".
zynthian-lv2-plugins skip
zynthian-puredata skip
# zynthian (aports/zynthian): built from checkouts (--src) or our own
zynthian-ui skip
zyncoder skip
zyncoder-hw skip
zynthian-data skip
zynthian-sys-config skip
zynthian-hw skip
postmarketos-ui-zynthian skip
# linux-rpi-rt follows Alpine's main/linux-rpi by hand (Repology's linux-rpi has no Alpine);
# raspberrypi/linux's stable_<date> tags aren't kernel versions
linux-rpi-rt ignore ^20[0-9]{6}$
