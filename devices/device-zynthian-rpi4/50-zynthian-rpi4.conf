# WirePlumber on zynthian kits (device-zynthian-rpi4): new devices at full volume. zynthian sets
# its levels in its mixer and the sound card's ALSA mixer (SOUNDCARD_MIXER), as on ZynthianOS,
# where nothing sits between JACK and the card; WirePlumber's default (0.4, about -24 dB) would
# lower everything on top.
wireplumber.settings = {
  device.routes.default-sink-volume = 1.0
  device.routes.default-source-volume = 1.0
}
