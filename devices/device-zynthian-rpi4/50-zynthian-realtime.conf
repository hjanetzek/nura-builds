# zynthian on the Raspberry Pi (device-zynthian-rpi4): real-time scheduling for the user manager,
# which runs PipeWire, WirePlumber and the user's services (zynthian started as a user service,
# jackd). Without it they get RLIMIT_RTPRIO 0 and run without real-time priority: the audio
# graph's jitter showed as 2-4 times the mean DSP time per cycle (docs/zynthian-rpi.md). The kiosk
# session has the same limits from postmarketos-ui-zynthian (tinydm.service.d).
[Service]
LimitRTPRIO=95
LimitNICE=-19
LimitMEMLOCK=infinity
