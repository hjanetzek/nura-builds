# No core dumps (as ZynthianOS): several LV2 plugins (JUCE/DPF builds: Helm, Obxd, Dexed, TAL, NAM)
# crash when jalv exits; writing their dumps to the SD card took systemd-coredump ~36 s for six at
# once, and zynthian's engine stop waits until the processes are gone (a snapshot load hung there).
# The crash is still logged ("terminated abnormally without generating a coredump").
[Coredump]
Storage=none
ProcessSizeMax=0
