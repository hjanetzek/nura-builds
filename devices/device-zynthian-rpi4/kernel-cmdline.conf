modules=loop,squashfs,sd-mod,usb-storage
quiet
dwc_otg.lpm_enable=0
console=tty1
cpufreq.default_governor=performance
# Grow the root partition to the whole SD card at boot (postmarketOS' initramfs only does it with
# this; the image's root partition is ~4 GB, full after a few downloads: webconf's soundfont
# packages failed with "No space left on device")
pmos.force-partition-resize
